# ---------- Application ----------
spring.application.name=ERM-MBPLC
# optional, git-ignored file with local secrets (overrides the values below)
spring.config.import=optional:file:./local.properties

# ---------- Datasource (H2 file DB for local use; override with the postgres / mysql profiles) ----------
#spring.datasource.url=jdbc:h2:file:./data/ermdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver

# ---- PostgreSQL (the password is in secrets.properties) ----
# Secrets are NOT stored in this file. Set ERM_DB_URL / ERM_DB_USER / ERM_DB_PASSWORD, or put the values in
# ./local.properties (git-ignored; see local.properties.example).
spring.datasource.url=${ERM_DB_URL:jdbc:postgresql://localhost:5432/erm_mbplc_dev}
spring.datasource.username=${ERM_DB_USER:}
spring.datasource.password=${ERM_DB_PASSWORD:}


# HikariCP (Spring Boot default pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000



# ---------- File uploads (photos + credential documents) ----------
# Relative default so the app starts on any machine; point at a real, backed-up volume in production.
app.upload-dir=${ERM_UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- JPA / Hibernate ----------
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
#spring.flyway.enabled=true

spring.jpa.properties.hibernate.format_sql=true
# avoids many lazy-loading N+1 problems
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- H2 console (keep OFF; it bypasses all application security) ----------
spring.h2.console.enabled=false

# ---------- Thymeleaf (the demo profile turns the cache off for UI work) ----------
spring.thymeleaf.cache=true

# ---------- Server ----------
server.port=8080
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# set ERM_COOKIE_SECURE=true as soon as the app is served over HTTPS
server.servlet.session.cookie.secure=${ERM_COOKIE_SECURE:false}
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful
server.compression.enabled=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# ---------- First-run administrator ----------
# Only used when the app_users table is empty (and the demo profile is NOT active).
# Set ERM_ADMIN_PASSWORD (min 12 chars). If empty, a random password is generated and printed ONCE in the log.
app.bootstrap.admin-password=${ERM_ADMIN_PASSWORD:}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
