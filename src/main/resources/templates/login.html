<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Sign in | NEXUS ERM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body class="login-bg"><div class="login-card"><div class="brand dark">BANK <span>ERM</span></div><h2>Welcome back</h2><p class="muted">Sign in to your enterprise workspace.</p><div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div><div class="alert alert-success" th:if="${param.logout}">You have signed out.</div><form method="post" th:action="@{/login}"><label>Username</label><input class="form-control mb-3" name="username" required autofocus><label>Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><small class="muted d-block mt-3">Authorized users only. All sign-ins and changes are logged.</small></div></body></html>
