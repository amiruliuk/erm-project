<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Resource recommendations')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container page"><h1>Resource recommendations</h1><p class="muted">Ranked using skill fit (70%) and estimated remaining capacity (30%).</p><form method="get" action="/assignments/recommend" class="form-grid"><select name="skillId"><option th:each="s:${skills}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == skillId}"></option></select><select name="requiredLevel"><option value="1">Level 1</option><option value="2">Level 2</option><option value="3" selected>Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option></select><select name="unitId"><option value="">All units</option><option th:each="u:${units}" th:value="${u.id}" th:text="${u.department.name + ' › ' + u.name}" th:selected="${unitId != null and u.id == unitId}"></option></select><button class="btn btn-primary">Find candidates</button></form><section class="panel mt-4"><table class="table"><thead><tr><th>Employee</th><th>Skill level</th><th>Available capacity</th><th>Match score</th></tr></thead><tbody><tr th:each="r:${recommendations}"><td th:text="${r.employee.fullName}"></td><td th:text="${r.skillLevel}"></td><td th:text="${r.availableCapacity} + '%'"></td><td><strong th:text="${r.score} + '%'"></strong></td></tr></tbody></table></section></main></body></html>
