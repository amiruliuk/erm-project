<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('RACI responsibility matrix')}"></head><body>
<div th:replace="~{fragments/layout :: nav}"></div><main class="container-fluid page"><div class="eyebrow">MANAGEMENT</div><h1>RACI responsibility matrix</h1><section class="panel mt-4" th:if="${canManage}"><h5>Add assignment</h5><p class="muted">Each activity may have only one Accountable person, and a person holds one role per activity. To change a role, remove the entry and add it again.</p><form method='post' th:action='@{/raci}' class='form-grid'><input name='activity' placeholder='Activity / deliverable' required><select name='projectId' required><option value=''>Project</option><option th:each='p:${projects}' th:value='${p.id}' th:text='${p.name}'></option></select><select name='employeeId' required><option value=''>Employee</option><option th:each='e:${employees}' th:value='${e.id}' th:text='${e.fullName}'></option></select><select name='role'><option>RESPONSIBLE</option><option>ACCOUNTABLE</option><option>CONSULTED</option><option>INFORMED</option></select><button class='btn btn-primary'>Add RACI assignment</button></form></section><div class="board-toolbar"><div class="d-flex gap-2 align-items-center flex-wrap"><span class="pill">Board records</span><th:block th:if="${canViewPeople}"><div th:replace="~{fragments/layout :: unitFilter('/raci')}"></div></th:block></div><div class="search-box"><i class="bi bi-search"></i><input type="search" placeholder="Search RACI assignments..." data-table-search="#raciRows"></div></div><section class="panel mt-3"><div class="panel-head"><h5>Records</h5><span class="muted">Live database records</span></div><div class="table-responsive"><table class='table'><thead><tr><th>Project</th><th>Activity</th><th>Employee</th><th>RACI role</th><th th:if="${canManage}"></th></tr></thead><tbody id="raciRows"><tr th:each='r:${entries}'><td th:text='${r.project.name}'></td><td th:text='${r.activity}'></td><td th:text='${r.employee.fullName}'></td><td><span class='tag' th:text='${r.role}'></span></td><td th:if="${canManage}"><form th:action="@{/raci/{id}/delete(id=${r.id})}" method="post" data-confirm="Remove this RACI assignment?"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr></tbody></table></div></section></main></body></html>
