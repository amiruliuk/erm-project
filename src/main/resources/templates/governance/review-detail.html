<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Complete review')}"></head>

<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container-fluid page">
    <div class="eyebrow">GOVERNANCE · CBS-GOV-003</div>
    <h1>Complete review</h1>

    <section class="panel mt-3">
        <div class="panel-head">
            <h5 th:text="${review.scope}"></h5>
            <span class="muted"
                  th:text="'Owner: ' + ${review.owner.fullName} + ' · Due: ' + ${review.dueOn}"></span>
        </div>
        <form method="post" th:action="@{/governance/reviews/{id}/complete(id=${review.id})}"
              class="form-grid" enctype="multipart/form-data">
            <select name="outcome" required>
                <option value="PASS">PASS</option>
                <option value="PARTIAL">PARTIAL</option>
                <option value="FAIL">FAIL</option>
            </select>
            <input type="date" name="completedOn" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
            <textarea name="notes" rows="4" placeholder="Review minutes / findings"></textarea>
            <input type="file" name="evidence" accept="application/pdf,image/png,image/jpeg">
            <button type="submit" class="btn btn-primary">Mark complete &amp; schedule next</button>
            <a class="btn btn-outline-secondary" th:href="@{/governance/reviews}">Cancel</a>
        </form>
    </section>
</main>
</body>
</html>
